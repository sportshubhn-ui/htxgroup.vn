<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Sphere Radial Gradient: Vibrant Emerald Green -->
    <radialGradient id="sphereGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="25%" stop-color="#22c55e" />
      <stop offset="65%" stop-color="#15803d" />
      <stop offset="90%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>
    
    <!-- Outer Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#22c55e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
    </radialGradient>

    <!-- Pearl Gradient -->
    <radialGradient id="pearlGrad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#dcfce7" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#166534" />
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#052e16" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="48" fill="url(#glowGrad)" />

  <!-- Main Green Planet -->
  <circle cx="50" cy="50" r="40" fill="url(#sphereGrad)" filter="url(#shadow)" />

  <!-- Sphere Rim Highlight (Glass shine effect) -->
  <ellipse cx="44" cy="24" rx="22" ry="12" fill="#ffffff" opacity="0.35" transform="rotate(-20 44 24)" />
  <circle cx="36" cy="28" r="4" fill="#ffffff" opacity="0.6" />

  <!-- Orbit Ring Ellipse tilted around planet -->
  <g transform="rotate(-30 50 50)">
    <ellipse cx="50" cy="50" rx="46" ry="12" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.85" />
    <ellipse cx="50" cy="50" rx="46" ry="12" fill="none" stroke="#4ade80" stroke-width="0.8" opacity="0.9" />
    <!-- Orbiting Pearl / Satellite Node on lower side -->
    <circle cx="10" cy="53" r="5" fill="url(#pearlGrad)" stroke="#ffffff" stroke-width="1" />
  </g>
</svg>
