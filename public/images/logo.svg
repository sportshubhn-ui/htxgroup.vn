<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="htxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c84cd" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="htxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="htxGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="htxShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1c84cd" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ICON EMBLEM -->
  <g transform="translate(10, 8)" filter="url(#htxShadow)">
    <!-- Hexagonal shield base -->
    <path d="M32 0 L60 16 L60 48 L32 64 L4 48 L4 16 Z" fill="none" stroke="url(#htxGrad1)" stroke-width="2.5" opacity="0.3" />

    <!-- Left Pillar (H left leg) -->
    <path d="M14 16 L24 16 L24 48 L14 48 Z" fill="url(#htxGrad1)" rx="2" />
    
    <!-- Right Pillar (H right leg) -->
    <path d="M40 16 L50 16 L50 48 L40 48 Z" fill="url(#htxGrad1)" rx="2" />

    <!-- Dynamic Crosslink / Leaf node (representing Hợp Tác & Nông nghiệp/Môi trường) -->
    <path d="M22 28 L42 28 L36 36 L16 36 Z" fill="url(#htxGradAccent)" />
    <path d="M22 36 L42 36 L42 38 L22 38 Z" fill="#ffffff" opacity="0.4" />
    
    <!-- Interlocking Center Diamond -->
    <polygon points="32,20 40,32 32,44 24,32" fill="#ffffff" opacity="0.95" />
    <circle cx="32" cy="32" r="3" fill="#1c84cd" />
  </g>

  <!-- BRAND NAME & TAGLINE -->
  <g transform="translate(85, 0)">
    <!-- HTX GROUP main title -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      <tspan fill="#1c84cd">HTX </tspan>
      <tspan fill="#1e293b">GROUP</tspan>
    </text>

    <!-- Tagline -->
    <text x="2" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1.8">
      TẬP ĐOÀN HỢP TÁC XÃ VIỆT NAM
    </text>

    <!-- Small decorative accent badge -->
    <rect x="235" y="24" width="60" height="15" rx="3" fill="#e0f2fe" />
    <text x="265" y="35" font-family="sans-serif" font-size="8" font-weight="800" fill="#0369a1" text-anchor="middle" letter-spacing="0.5">
      SINCE 2014
    </text>
  </g>
</svg>
